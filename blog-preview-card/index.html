<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="css/style.css" />

    <title>Frontend Mentor | Blog preview card</title>
  </head>
  <body>
    <main>
      <article class="card">
        <img src="images/illustration-article.svg" alt="" class="card__image" />
        <div class="card__content">
          <span class="card__badge">Learning</span>
          <p class="card__date">
            Published <time datetime="2023-12-21">21 Dec 2023</time>
          </p>
          <h1 class="card__title"><a href="#">HTML &amp; CSS foundations</a></h1>
          <p class="card__description">
            These languages are the backbone of every website, defining
            structure, content, and presentation.
          </p>
        </div>
        <div class="card__author">
          <img src="images/image-avatar.webp" alt="" class="card__avatar" />
          <p class="card__author-name">Greg Hooper</p>
        </div>
      </article>
    </main>

    <footer class="attribution">
      <p>
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a
        >. Coded by
        <a href="https://tarek-elzoghby.github.io/tarek-elzoghby-hub/"
          >Tarek Elzoghby</a
        >.
      </p>
    </footer>
  </body>
</html>
